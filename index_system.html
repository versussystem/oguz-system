<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>6/C - Oğuz Programlama</title>

    <style>
        body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: white;
        color: black;
        text-align: center;
        }

        .baslik {
        font-size: 42px;
        font-weight: bold;
        margin-top: 25px;
        }

        .kutu {
        width: 92%;
        max-width: 650px;
        margin: 25px auto;
        border: 2px solid black;
        padding: 20px;
        box-sizing: border-box;
        }

        input {
        width: 90%;
        padding: 12px;
        margin: 6px;
        font-size: 16px;
        box-sizing: border-box;
        }

        button {
        padding: 11px 22px;
        margin: 6px;
        font-size: 16px;
        cursor: pointer;
        background: white;
        color: black;
        border: 2px solid black;
        }

        button:hover {
        background: black;
        color: white;
        }

        #liste {
        margin-top: 15px;
        text-align: left;
        }

        .ogrenci {
        padding: 11px;
        border-bottom: 1px solid #aaa;
        font-size: 19px;
        }

        .aktif {
        font-weight: bold;
        background: #eeeeee;
        }

        .gizli {
        display: none;
        }

        #durum {
        margin: 15px;
        font-size: 18px;
        }

        .alt {
        margin-top: 50px;
        padding: 20px;
        border-top: 1px solid black;
        }

        .yonetim {
        border-top: 1px solid #aaa;
        margin-top: 25px;
        padding-top: 20px;
        }

        .sil {
        float: right;
        padding: 5px 10px;
        margin: 0;
        font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="baslik">6/C</div>

    <!-- ŞİFRE -->
    <div id="sifreEkrani" class="kutu">

    <h2>Siteye Giriş</h2>

    <input
    type="email"
    id="email"
    placeholder="E-posta"
    onkeydown="if(event.key==='Enter') giris()"
    >

    <input
    type="password"
    id="sifre"
    placeholder="Şifre"
    onkeydown="if(event.key==='Enter') giris()"
    >

    <br>

    <button onclick="giris()">GİRİŞ</button>

    <p id="sifreHata"></p>

</div>


<!-- ANA SİSTEM -->
<div id="anaSistem" class="kutu gizli">

<h2>Öğrenci Sıra Sistemi</h2>

<hr>

<h3>Öğrenci Listesi</h3>

<button onclick="ikiHaftayiSimuleEt()">
    2 HAFTAYI SİMÜLE ET
</button>

<div id="liste"></div>


<!-- ÖĞRENCİ EKLEME -->
<div class="yonetim">

<h3>Öğrenci Ekle</h3>

<input
type="text"
id="yeniOgrenci"
placeholder="Öğrenci adı"
onkeydown="if(event.key==='Enter') ogrenciEkle()"
>

<br>

<button onclick="ogrenciEkle()">
ÖĞRENCİ EKLE
</button>

</div>

</div>


<div class="alt">
Oğuz Programlama
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

    // =====================================
    // SUPABASE
    // =====================================

    const SUPABASE_URL = "https://aomxtamznulqgnshihwy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_QIn06PBaZZUb60YhdIeusQ_gTDJovWm";

    const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
    );


    // Öğrenciler artık Supabase'den alınır.
    let ogrenciler = [];

    // =====================================
    // DEĞİŞKENLER
    // =====================================
// Her 2 haftada bir bütün öğrencilerin sıra numarası 1 artar. Bu sistem otomatik olarak çalışır; 6 saniyelik geçiş yoktur.
    // 0 = Ceren 1, Nihat 2, ... Irmak 37
    let siraKaymasi =
    Number(localStorage.getItem("6C_siraKaymasi") || 0);


    // =====================================
    // GİRİŞ
    // =====================================

    async function giris() {
    const email = document.getElementById("email").value.trim();
    const sifre = document.getElementById("sifre").value;

    const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: sifre
    });

    if (error) {
    document.getElementById("sifreHata").innerText =
    "E-posta veya şifre yanlış!";
    return;
    }

    document.getElementById("sifreEkrani").classList.add("gizli");
    document.getElementById("anaSistem").classList.remove("gizli");

    await ogrencileriYukle();
    }


    async function ogrencileriYukle() {
    const { data, error } = await supabaseClient
    .from("6cogrenciler")
    .select("isim, sira")
    .order("sira", { ascending: true });

    if (error) {
    console.error(error);
    alert("Öğrenci listesi alınamadı. Supabase RLS ayarlarını kontrol et.");
    return;
    }

    ogrenciler = data.map(x => x.isim);
    listeyiGoster();
    ikiHaftaKontrol();
    }


    // =====================================
    // LİSTEYİ GÖSTER
    // =====================================

    function listeyiGoster() {

    const liste =
    document.getElementById("liste");

    liste.innerHTML = "";

    ogrenciler.forEach(function(isim, index) {

    const div =
    document.createElement("div");

    div.className = "ogrenci";

    div.id = "ogrenci-" + index;

    // Sıra numarası:
    // İlk hafta: Ceren=1, Nihat=2, ... Irmak=37
    // Her 2 haftada bir herkes 1 sıra ileri gider.
    const numara =
    ((index + siraKaymasi) % ogrenciler.length) + 1;

    div.innerHTML =
    numara +
    " - " +
    isim +
    '<button class="sil" onclick="ogrenciSil(' +
    index +
    ')">SİL</button>';

    liste.appendChild(div);

    });

    }


    // =====================================
    // ÖĞRENCİ EKLE
    // =====================================

    async function ogrenciEkle() {
    const kutu = document.getElementById("yeniOgrenci");
    const isim = kutu.value.trim();

    if (isim === "") {
    alert("Öğrenci adı yaz!");
    return;
    }

    const { error } = await supabaseClient
    .from("6cogrenciler")
    .insert([{ isim: isim, sira: ogrenciler.length + 1 }]);

    if (error) {
    console.error(error);
    alert("Öğrenci eklenemedi. RLS izinlerini kontrol et.");
    return;
    }

    kutu.value = "";
    await ogrencileriYukle();
    }


    async function ogrenciSil(index) {
    const isim = ogrenciler[index];

    if (!confirm(isim + " adlı öğrenciyi silmek istiyor musun?")) {
    return;
    }

    const { data, error } = await supabaseClient
    .from("6cogrenciler")
    .select("id")
    .eq("isim", isim)
    .limit(1)
    .single();

    if (error || !data) {
    alert("Öğrenci bulunamadı.");
    return;
    }

    const { error: deleteError } = await supabaseClient
    .from("6cogrenciler")
    .delete()
    .eq("id", data.id);

    if (deleteError) {
    console.error(deleteError);
    alert("Öğrenci silinemedi. RLS izinlerini kontrol et.");
    return;
    }

    await ogrencileriYukle();
    }

    // =====================================
    // 2 HAFTALIK SİSTEM
    // =====================================

    const ikiHafta = 14 * 24 * 60 * 60 * 1000;

    let sonYenileme =
        Number(localStorage.getItem("6C_sonYenileme") || Date.now());

    // Her 2 haftada herkesin sırası 1 artar.
    function ikiHaftaKontrol() {
        const simdi = Date.now();
        const fark = simdi - sonYenileme;

        if (fark >= ikiHafta && ogrenciler.length > 0) {
            const kacDonem = Math.floor(fark / ikiHafta);

            siraKaymasi =
                (siraKaymasi + kacDonem) % ogrenciler.length;

            sonYenileme += kacDonem * ikiHafta;

            localStorage.setItem(
                "6C_siraKaymasi",
                siraKaymasi
            );

            localStorage.setItem(
                "6C_sonYenileme",
                sonYenileme
            );

            listeyiGoster();
        }
    }

    // Butona basınca 2 haftalık geçişi hemen uygular.
    function ikiHaftayiSimuleEt() {
        if (ogrenciler.length === 0) {
            alert("Önce öğrenci listesinin yüklenmesi gerekiyor.");
            return;
        }

        siraKaymasi =
            (siraKaymasi + 1) % ogrenciler.length;

        sonYenileme = Date.now();

        localStorage.setItem(
            "6C_siraKaymasi",
            siraKaymasi
        );

        localStorage.setItem(
            "6C_sonYenileme",
            sonYenileme
        );

        listeyiGoster();

        alert("2 hafta simüle edildi! Herkesin sırası 1 arttı.");
    }


</script>

</body>
</html>
