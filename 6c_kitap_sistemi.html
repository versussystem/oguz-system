<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>6/C - Oğuz Programlama</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: white;
        color: black;
        text-align: center;
    }

    .baslik {
        font-size: 42px;
        font-weight: bold;
        margin-top: 25px;
    }

    .kutu {
        width: 92%;
        max-width: 650px;
        margin: 25px auto;
        border: 2px solid black;
        padding: 20px;
        box-sizing: border-box;
    }

    input {
        width: 90%;
        padding: 12px;
        margin: 6px;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        padding: 11px 22px;
        margin: 6px;
        font-size: 16px;
        cursor: pointer;
        background: white;
        color: black;
        border: 2px solid black;
    }

    button:hover {
        background: black;
        color: white;
    }

    #liste {
        margin-top: 15px;
        text-align: left;
    }

    .ogrenci {
        padding: 11px;
        border-bottom: 1px solid #aaa;
        font-size: 19px;
    }

    .aktif {
        font-weight: bold;
        background: #eeeeee;
    }

    .gizli {
        display: none;
    }

    #durum {
        margin: 15px;
        font-size: 18px;
        font-weight: bold;
    }

    .alt {
        margin-top: 50px;
        padding: 20px;
        border-top: 1px solid black;
    }

    .yonetim {
        border-top: 1px solid #aaa;
        margin-top: 25px;
        padding-top: 20px;
    }

    .sil {
        float: right;
        padding: 5px 10px;
        margin: 0;
        font-size: 13px;
    }

    .sayac {
        font-size: 16px;
        margin: 10px;
    }
</style>
</head>

<body>

<div class="baslik">6/C</div>

<!-- ŞİFRE -->
<div id="sifreEkrani" class="kutu">
    <h2>Siteye Giriş</h2>
    <input
        type="email"
        id="email"
        placeholder="E-posta"
        onkeydown="if(event.key==='Enter') giris()"
    >
    <input
        type="password"
        id="sifre"
        placeholder="Şifre"
        onkeydown="if(event.key==='Enter') giris()"
    >
    <br>
    <button onclick="giris()">GİRİŞ</button>
    <p id="sifreHata" style="color:red;"></p>
</div>


<!-- ANA SİSTEM -->
<div id="anaSistem" class="kutu gizli">
    <h2>Öğrenci Sıra Sistemi</h2>

    <div id="durum">
        Sistem kapalı
    </div>

    <div class="sayac" id="siradakiYazi">
        Sıradaki: -
    </div>

    <button onclick="baslat()">BAŞLAT</button>
    <button onclick="durdur()">DURDUR</button>

    <hr>

    <h3>Öğrenci Listesi</h3>
    <div id="liste"></div>

    <!-- ÖĞRENCİ EKLEME -->
    <div class="yonetim">
        <h3>Öğrenci Ekle</h3>
        <input
            type="text"
            id="yeniOgrenci"
            placeholder="Öğrenci adı"
            onkeydown="if(event.key==='Enter') ogrenciEkle()"
        >
        <br>
        <button onclick="ogrenciEkle()">ÖĞRENCİ EKLE</button>
    </div>
</div>

<div class="alt">
    Oğuz Programlama
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

// =====================================
// SUPABASE
// =====================================

const SUPABASE_URL = "https://aomxtamznulqgnshihwy.supabase.co";
const SUPABASE_KEY = "sb_publishable_QIn06PBaZZUb60YhdIeusQ_gTDJovWm";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let ogrenciler = [];

// =====================================
// DEĞİŞKENLER
// =====================================

// Sistem ilk defa açılıyorsa veya daha önce çalıştırılmadıysa durdurulmuş başlatır
if (localStorage.getItem("6C_calisiyor") === null) {
    localStorage.setItem("6C_calisiyor", "false");
}

let calisiyor = localStorage.getItem("6C_calisiyor") === "true";
let siraKaymasi = Number(localStorage.getItem("6C_siraKaymasi") || 0);
let siradaki = 0;
let zamanlayici = null;

// Her 14 günde bir sıra kayması
const ikiHafta = 14 * 24 * 60 * 60 * 1000;
let gecmisMs = Number(localStorage.getItem("6C_gecmisMs") || 0);
let baslangicZamani = Number(localStorage.getItem("6C_baslangicZamani") || 0);

// =====================================
// GİRİŞ
// =====================================

async function giris() {
    const email = document.getElementById("email").value.trim();
    const sifre = document.getElementById("sifre").value;

    const { error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: sifre
    });

    if (error) {
        document.getElementById("sifreHata").innerText = "E-posta veya şifre yanlış!";
        return;
    }

    document.getElementById("sifreEkrani").classList.add("gizli");
    document.getElementById("anaSistem").classList.remove("gizli");

    // Ekranda sistemin mevcut durumunu yazdır
    document.getElementById("durum").innerText = calisiyor ? "Sistem çalışıyor" : "Sistem DURDURULDU";

    await ogrencileriYukle();
}

async function ogrencileriYukle() {
    const { data, error } = await supabaseClient
        .from("6cogrenciler")
        .select("isim, sira")
        .order("sira", { ascending: true });

    if (error) {
        console.error(error);
        alert("Öğrenci listesi alınamadı. Supabase RLS ayarlarını kontrol et.");
        return;
    }

    ogrenciler = data.map(x => x.isim);
    
    // Eğer HTML kapalıyken 14 gün dolduysa açılışta hemen kontrol edip listeyi günceller
    onDortGunKontrol(); 
    listeyiGoster();
}

// =====================================
// LİSTEYİ GÖSTER
// =====================================

function listeyiGoster() {
    const liste = document.getElementById("liste");
    liste.innerHTML = "";

    ogrenciler.forEach(function(isim, index) {
        const div = document.createElement("div");
        div.className = "ogrenci";
        div.id = "ogrenci-" + index;

        // Sıra numarası (14 gün geçtikçe herkesin sırası +1 kayar, sondaki 1 olur)
        const numara = ((index + siraKaymasi) % ogrenciler.length) + 1;

        div.innerHTML = numara + " - " + isim +
            '<button class="sil" onclick="ogrenciSil(' + index + ')">SİL</button>';

        liste.appendChild(div);
    });

    siradakiGoster();
}

// =====================================
// ÖĞRENCİ EKLE VE SİL
// =====================================

async function ogrenciEkle() {
    const kutu = document.getElementById("yeniOgrenci");
    const isim = kutu.value.trim();

    if (isim === "") {
        alert("Öğrenci adı yaz!");
        return;
    }

    const { error } = await supabaseClient
        .from("6cogrenciler")
        .insert([{ isim: isim, sira: ogrenciler.length + 1 }]);

    if (error) {
        console.error(error);
        alert("Öğrenci eklenemedi. RLS izinlerini kontrol et.");
        return;
    }

    kutu.value = "";
    await ogrencileriYukle();
}

async function ogrenciSil(index) {
    const isim = ogrenciler[index];

    if (!confirm(isim + " adlı öğrenciyi silmek istiyor musun?")) return;

    const { data, error } = await supabaseClient
        .from("6cogrenciler")
        .select("id")
        .eq("isim", isim)
        .limit(1)
        .single();

    if (error || !data) {
        alert("Öğrenci bulunamadı.");
        return;
    }

    const { error: deleteError } = await supabaseClient
        .from("6cogrenciler")
        .delete()
        .eq("id", data.id);

    if (deleteError) {
        console.error(deleteError);
        alert("Öğrenci silinemedi. RLS izinlerini kontrol et.");
        return;
    }

    await ogrencileriYukle();
}

// =====================================
// BAŞLAT / DURDUR
// =====================================

function baslat() {
    if (ogrenciler.length === 0) {
        alert("Listede öğrenci yok!");
        return;
    }
    if (calisiyor) return;

    calisiyor = true;
    localStorage.setItem("6C_calisiyor", "true");
    baslangicZamani = Date.now();
    siraZamanlayicisiniKaydet();

    document.getElementById("durum").innerText = "Sistem çalışıyor";
    siradakiGoster();
}

function durdur() {
    if (!calisiyor) return;

    if (baslangicZamani) {
        gecmisMs += Date.now() - baslangicZamani;
    }

    calisiyor = false;
    localStorage.setItem("6C_calisiyor", "false");
    baslangicZamani = 0;
    siraZamanlayicisiniKaydet();

    document.getElementById("durum").innerText = "Sistem DURDURULDU";
}

// =====================================
// SIRADAKİ ÖĞRENCİ
// =====================================

function siradakiGoster() {
    document.querySelectorAll(".ogrenci").forEach(function(element) {
        element.classList.remove("aktif");
    });

    if (ogrenciler.length === 0) {
        document.getElementById("siradakiYazi").innerText = "Sıradaki: -";
        return;
    }

    const aktif = document.getElementById("ogrenci-" + siradaki);
    if (aktif) {
        aktif.classList.add("aktif");
    }

    const aktifNumara = ((siradaki + siraKaymasi) % ogrenciler.length) + 1;
    document.getElementById("siradakiYazi").innerText = "Sıradaki: " + aktifNumara + " - " + ogrenciler[siradaki];
}

// =====================================
// 14 GÜNLÜK ZAMANLAYICI (KAPALIYKEN BİLE SAYAR)
// =====================================

function toplamGecenSure() {
    return gecmisMs + (calisiyor && baslangicZamani ? Date.now() - baslangicZamani : 0);
}

function siraZamanlayicisiniKaydet() {
    localStorage.setItem("6C_gecmisMs", String(gecmisMs));
    localStorage.setItem("6C_baslangicZamani", String(baslangicZamani));
}

// JavaScript'te fonksiyon isimleri sayıyla başlayamaz. "14GunKontrol" adını değiştirdik.
function onDortGunKontrol() {
    let toplam = toplamGecenSure();
    if (toplam < ikiHafta || ogrenciler.length === 0) return;

    // Kaç tane 14 gün geçtiğini hesaplar
    const kacDonem = Math.floor(toplam / ikiHafta);
    siraKaymasi = (siraKaymasi + kacDonem) % ogrenciler.length;
    localStorage.setItem("6C_siraKaymasi", String(siraKaymasi));

    const kullanilan = kacDonem * ikiHafta;
    toplam -= kullanilan;

    if (calisiyor) {
        gecmisMs = toplam;
        baslangicZamani = Date.now();
    } else {
        gecmisMs = toplam;
        baslangicZamani = 0;
    }

    siraZamanlayicisiniKaydet();
    listeyiGoster();
}

function zamanlayiciyiGuncelle() {
    if (!calisiyor) return;
    onDortGunKontrol();
}

// Her saniye kontrol et
zamanlayici = setInterval(zamanlayiciyiGuncelle, 1000);

</script>
</body>
</html>
